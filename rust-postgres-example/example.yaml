services:
  db:
    build: db
    env_file:
      - .env
    container_name: example_container
    healthcheck:
      test: pg_isready -U $POSTGRES_USER
      interval: 5s
      timeout: 5s
      retries: 5
  backend:
    depends_on:
      db:
        condition: service_healthy
    build: backend
  adminer:
    image: docker.io/adminer
    ports:
      - 8080:8080
